services:
  - type: web
    name: living-legacy-backend
    env: python
    plan: free
    root_dir: backend
    pythonVersion: 3.9
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        value: $GOOGLE_API_KEY
      - key: GOOGLE_SEARCH_ENGINE_ID
        value: $GOOGLE_SEARCH_ENGINE_ID

  - type: web
    name: living-legacy-frontend
    env: node
    plan: free
    root_dir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_BASE
        value: https://living-legacy-backend.onrender.com/api
      - key: VITE_MAPBOX_TOKEN
        value: $VITE_MAPBOX_TOKEN
